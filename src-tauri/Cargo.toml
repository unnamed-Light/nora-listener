[package]
name = "app"
version = "1.0.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2.3.6"
tauri-plugin-dialog = "2"
candle-core = "0.8.2"
candle-nn = "0.8.2"
candle-transformers = "0.8.2"
tokenizers = "0.19.1"
anyhow = "1.0.104"
rand = "0.8"
byteorder = "1.5.0"
hound = "3.5.1"
hf-hub = "0.4.0"
symphonia = { version = "0.5.5", features = ["all"] }
rubato = "1.0.1"
flate2 = "1.1.10"
reqwest = { version = "0.12", features = ["blocking", "multipart"] }
cpal = "0.15"

[profile.release]
opt-level = 2
codegen-units = 16
lto = false
